  <script>
    // ---------- Foutlogboek in de app ----------
    // Op een iPhone kun je niet bij het foutlogboek van de browser. Zonder dit
    // is een fout melden onmogelijk: je ziet alleen dat iets niet werkt.
    // Uit de opslag halen, zodat het logboek een herlaadbeurt overleeft. Stond
    // het alleen in het geheugen, dan was het weg zodra je de app opnieuw opende
    // — precies op het moment dat je het nodig hebt.
    window.pollepelLog = (function () {
      try {
        const bewaard = localStorage.getItem("pollepel-log");
        return bewaard ? JSON.parse(bewaard) : [];
      } catch (e) { return []; }
    })();

    (function () {
      let opslaanGepland = false;
      const opslaan = () => {
        if (opslaanGepland) return;
        opslaanGepland = true;
        // Even wachten: bij tien meldingen achter elkaar niet tien keer schrijven.
        setTimeout(() => {
          opslaanGepland = false;
          try { localStorage.setItem("pollepel-log", JSON.stringify(window.pollepelLog)); }
          catch (e) { /* opslag vol of geweigerd: dan alleen in het geheugen */ }
        }, 500);
      };

      const bewaar = (soort, argumenten) => {
        try {
          const tekst = Array.from(argumenten).map((a) => {
            if (a instanceof Error) return a.stack || a.message;
            if (typeof a === "object") { try { return JSON.stringify(a).slice(0, 400); } catch (e) { return String(a); } }
            return String(a);
          }).join(" ");
          // Van "info" alleen het eigen kookverslag; de rest is ruis van
          // bibliotheken en zou de echte meldingen uit het logboek drukken.
          if (soort === "info" && !/^\[[a-z0-9]{4} v\d+\]/.test(tekst)) return;
          window.pollepelLog.push({ tijd: new Date().toISOString(), soort, tekst: tekst.slice(0, 600) });
          if (window.pollepelLog.length > 150) window.pollepelLog.shift();
          opslaan();
        } catch (e) { /* logboek mag nooit zelf stukgaan */ }
      };
      // "info" voor het kookverslag: geen fout, maar wel nodig om te zien wat
      // er bij het koken is opgeslagen.
      ["error", "warn", "info"].forEach((soort) => {
        const origineel = console[soort].bind(console);
        console[soort] = function () { bewaar(soort, arguments); origineel.apply(console, arguments); };
      });
      window.addEventListener("error", (e) => bewaar("error", [e.message, e.filename + ":" + e.lineno]));
      window.addEventListener("unhandledrejection", (e) => bewaar("error", ["Niet afgevangen: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)]));
    })();

    // ---------- Barcode-decoder ----------
    // BarcodeDetector bestaat niet op iOS (elke browser daar draait op WebKit).
    // Daarom laden we ZBar als WebAssembly, maar pas wanneer de scanner opengaat.
    window.barcodeDecoder = (function () {
      let zbarPromise = null;

      function loadZbar() {
        if (zbarPromise) return zbarPromise;
        zbarPromise = new Promise((resolve, reject) => {
          if (window.zbarWasm) return resolve(window.zbarWasm);
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.js";
          s.async = true;
          s.onload = () => (window.zbarWasm ? resolve(window.zbarWasm) : reject(new Error("zbar niet beschikbaar")));
          s.onerror = () => reject(new Error("zbar kon niet worden gedownload"));
          document.head.appendChild(s);
        });
        return zbarPromise;
      }

      // EAN-13/EAN-8/UPC hebben een controlecijfer; daarmee filteren we misreads eruit.
      function checksumOk(code) {
        if (!/^\d{8}$|^\d{12,14}$/.test(code)) return true; // ander formaat: niet controleerbaar
        const digits = code.split("").map(Number);
        const check = digits.pop();
        let sum = 0;
        digits.reverse().forEach((d, i) => { sum += d * (i % 2 === 0 ? 3 : 1); });
        return (10 - (sum % 10)) % 10 === check;
      }

      const FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "itf"];

      return {
        checksumOk,
        // 'native' is sneller (Android), 'wasm' werkt overal inclusief iOS.
        async prepare() {
          if ("BarcodeDetector" in window) {
            try {
              const supported = await window.BarcodeDetector.getSupportedFormats();
              if (supported && supported.includes("ean_13")) {
                const det = new window.BarcodeDetector({ formats: FORMATS.filter((f) => supported.includes(f)) });
                return {
                  kind: "native",
                  detect: async (canvas) => {
                    const codes = await det.detect(canvas);
                    return codes && codes.length ? codes[0].rawValue : null;
                  },
                };
              }
            } catch (e) { /* val terug op wasm */ }
          }
          const zbar = await loadZbar();
          return {
            kind: "wasm",
            detect: async (canvas) => {
              const ctx = canvas.getContext("2d", { willReadFrequently: true });
              const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const symbols = await zbar.scanImageData(imageData);
              if (!symbols || !symbols.length) return null;
              return symbols[0].decode() || null;
            },
          };
        },
      };
    })();
  </script>

  <script type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { createClient } from "@supabase/supabase-js";
    import App from "/app.js";

    const SUPABASE_URL = "https://ucevkzircawpapsrywfv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_t0F12XeC1bPLzmZgvLWUeQ_CPat-lMn";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const C = { blue: "#1F3F66", blueDeep: "#152C48", ceramic: "#EAE7DC", mustard: "#D9A441", brick: "#B5533C", ink: "#1C1D1B", inkSoft: "#5B5C57" };
    const inputStyle = { width: "100%", boxSizing: "border-box", border: "1.5px solid rgba(31,63,102,0.25)", borderRadius: 12, padding: "11px 12px", fontSize: 16, marginBottom: 10 };
    const btnStyle = { width: "100%", background: C.blue, color: "#fff", border: "none", borderRadius: 14, padding: "12px", fontSize: 15, fontWeight: 600, cursor: "pointer" };
    const ghostBtnStyle = { width: "100%", background: "none", color: C.blue, border: `1.5px solid ${C.blue}`, borderRadius: 14, padding: "10px", fontSize: 14, fontWeight: 600, cursor: "pointer", marginTop: 8 };

    function Shell({ children }) {
      return React.createElement("div", {
        style: { minHeight: "100vh", background: C.ceramic, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }
      }, React.createElement("div", {
        style: { width: "100%", maxWidth: 380, background: "#fff", borderRadius: 24, padding: 26, boxShadow: "0 10px 30px rgba(31,63,102,0.12)" }
      }, children));
    }

    function AuthScreen({ onAuthed }) {
      const [mode, setMode] = useState("login"); // login | signup
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [info, setInfo] = useState("");
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setError(""); setInfo(""); setLoading(true);
        try {
          if (mode === "signup") {
            // Terugkeeradres expliciet meegeven. Zonder dit gebruikt Supabase
            // het adres uit de projectinstellingen, en dat staat standaard op
            // localhost — waar niemand ooit terechtkomt. De uitnodigingscode
            // gaat mee, zodat die de mailwissel overleeft.
            const terug = window.location.origin + window.location.pathname + window.location.search;
            const { data, error } = await supabase.auth.signUp({
              email, password,
              options: { emailRedirectTo: terug },
            });
            if (error) throw error;
            if (!data.session) {
              setError("");
              setInfo("Bijna klaar! Check je e-mail (" + email + ") en klik op de bevestigingslink. Log daarna hieronder in.");
              setMode("login");
              setLoading(false);
              return;
            }
          } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
          }
          onAuthed();
        } catch (e) {
          // "Invalid login credentials" krijg je ook als het account wél bestaat
          // maar nog niet bevestigd is. "Geen account bekend" is dan misleidend.
          const ruw = (e.message || "").toLowerCase();
          if (ruw.includes("email not confirmed")) {
            setError("Je account bestaat, maar is nog niet bevestigd. Kijk in je mail — ook bij ongewenst — of vraag de beheerder van je huishouden om hulp.");
          } else if (ruw.includes("invalid login credentials")) {
            setError("Inloggen lukt niet. Klopt je wachtwoord? Heb je je net aangemeld, open dan eerst de bevestigingsmail.");
          } else if (ruw.includes("rate limit") || ruw.includes("429")) {
            setError("Er zijn te veel berichten verstuurd. Probeer het over een uur opnieuw.");
          } else if (ruw.includes("already registered")) {
            setError("Dit e-mailadres is al bekend. Log in met je wachtwoord in plaats van een nieuw account te maken.");
          } else if (e.code === "weak_password" || ruw.includes("password should")) {
            // Zet je in Supabase eisen aan het wachtwoord, dan komt hier een
            // Engelse technische tekst uit: "Password should contain at least
            // one character of each: abcdefghijklmnopqrstuvwxyz, ...". Dat is
            // geen melding waar iemand iets aan heeft, dus we zeggen het zelf.
            //
            // De eisen staan niet hard in de app: ze staan in Supabase en
            // kunnen daar veranderen. Daarom beschrijven we wat er nodig is
            // zonder getallen te noemen die kunnen gaan afwijken, en zetten we
            // de oorspronkelijke tekst eronder voor wie wil weten wat er mist.
            const lengte = ruw.match(/at least (\d+) characters/);
            setError(
              "Dit wachtwoord is te zwak. Kies er een van minstens "
              + (lengte ? lengte[1] : "acht") + " tekens, met hoofdletters, "
              + "kleine letters en cijfers erin. Een wachtwoordbeheerder maakt in "
              + "\u00e9\u00e9n tik een goede."
            );
          } else {
            setError(e.message || "Er ging iets mis. Probeer het opnieuw.");
          }
        } finally {
          setLoading(false);
        }
      };

      return React.createElement(Shell, null,
        React.createElement("h1", { style: { fontSize: 22, fontWeight: 700, color: C.blueDeep, margin: "0 0 4px" } }, "Pollepel"),
        React.createElement("p", { style: { fontSize: 13, color: C.inkSoft, margin: "0 0 18px" } }, mode === "login" ? "Log in bij jouw huishouden." : "Maak een account aan."),
        React.createElement("input", { style: inputStyle, type: "email", placeholder: "E-mailadres", value: email, onChange: (e) => setEmail(e.target.value) }),
        React.createElement("input", { style: inputStyle, type: "password", placeholder: "Wachtwoord (min. 6 tekens)", value: password, onChange: (e) => setPassword(e.target.value) }),
        info && React.createElement("p", { style: { color: C.blue, fontSize: 12.5, margin: "0 0 10px", background: "#EAF1F8", padding: "8px 10px", borderRadius: 10 } }, info),
        error && React.createElement("p", { style: { color: C.brick, fontSize: 12.5, margin: "0 0 10px" } }, error),
        React.createElement("button", { style: { ...btnStyle, opacity: loading ? 0.6 : 1 }, disabled: loading, onClick: submit }, loading ? "Bezig…" : mode === "login" ? "Inloggen" : "Account aanmaken"),
        React.createElement("button", { style: ghostBtnStyle, onClick: () => setMode(mode === "login" ? "signup" : "login") },
          mode === "login" ? "Nog geen account? Registreren" : "Al een account? Inloggen")
      );
    }

    function HouseholdScreen({ onReady }) {
      // Kwam je binnen via een uitnodigingslink, dan staat de code al klaar.
      // Overtypen uit een appje is precies de stap waarop mensen afhaken.
      const uitnodiging = (() => {
        try {
          const p = new URLSearchParams(window.location.search);
          return (p.get("uitnodiging") || p.get("invite") || "").trim().toUpperCase();
        } catch (e) { return ""; }
      })();

      const [mode, setMode] = useState(uitnodiging ? "join" : "create");
      const [name, setName] = useState("Ons huishouden");
      const [code, setCode] = useState(uitnodiging);
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        setError(""); setLoading(true);
        try {
          if (mode === "create") {
            const { data, error } = await supabase.rpc("create_household", { hh_name: name || "Ons huishouden" });
            if (error) throw error;
            onReady(data.id);
          } else {
            const { data, error } = await supabase.rpc("join_household", { code: code.trim() });
            if (error) throw error;
            onReady(data.id);
          }
        } catch (e) {
          setError(e.message || "Er ging iets mis. Probeer het opnieuw.");
        } finally {
          setLoading(false);
        }
      };

      return React.createElement(Shell, null,
        React.createElement("h1", { style: { fontSize: 20, fontWeight: 700, color: C.blueDeep, margin: "0 0 4px" } },
          uitnodiging ? "Je bent uitgenodigd" : "Welkom bij Pollepel"),
        React.createElement("p", { style: { fontSize: 13, color: C.inkSoft, margin: "0 0 18px" } },
          uitnodiging
            ? "Tik op Aansluiten om mee te doen. Jullie delen dan recepten, voorraad, weekmenu en boodschappenlijst."
            : "Begin een nieuw huishouden, of sluit aan bij je huisgenoten."),
        React.createElement("div", { style: { display: "flex", gap: 6, marginBottom: 14 } },
          React.createElement("button", {
            style: { flex: 1, padding: "8px", borderRadius: 10, border: `1.5px solid ${mode === "create" ? C.blue : "#ddd"}`, background: mode === "create" ? C.blue : "#fff", color: mode === "create" ? "#fff" : C.ink, fontWeight: 600, fontSize: 13, cursor: "pointer" },
            onClick: () => setMode("create"),
          }, "Nieuw huishouden"),
          React.createElement("button", {
            style: { flex: 1, padding: "8px", borderRadius: 10, border: `1.5px solid ${mode === "join" ? C.blue : "#ddd"}`, background: mode === "join" ? C.blue : "#fff", color: mode === "join" ? "#fff" : C.ink, fontWeight: 600, fontSize: 13, cursor: "pointer" },
            onClick: () => setMode("join"),
          }, "Aansluiten")
        ),
        mode === "create"
          ? React.createElement("input", { style: inputStyle, placeholder: "Naam huishouden", value: name, onChange: (e) => setName(e.target.value) })
          : React.createElement("input", { style: inputStyle, placeholder: "Uitnodigingscode", value: code, onChange: (e) => setCode(e.target.value) }),
        mode === "create" && React.createElement("p", { style: { fontSize: 11.5, color: C.inkSoft, marginTop: -6, marginBottom: 10 } }, "Je krijgt automatisch de startbibliotheek met 31 recepten."),
        error && React.createElement("p", { style: { color: C.brick, fontSize: 12.5, margin: "0 0 10px" } }, error),
        React.createElement("button", { style: { ...btnStyle, opacity: loading ? 0.6 : 1 }, disabled: loading, onClick: submit }, loading ? "Bezig…" : mode === "create" ? "Huishouden aanmaken" : "Aansluiten")
      );
    }

    function setupBackend(householdId) {
      window.storage = {
        async get(key) {
          const { data, error } = await supabase.from("household_kv").select("value").eq("household_id", householdId).eq("key", key).maybeSingle();
          if (error || !data) throw new Error("not found");
          return { key, value: data.value, shared: true };
        },
        async set(key, value) {
          const { error } = await supabase.from("household_kv").upsert({ household_id: householdId, key, value, updated_at: new Date().toISOString() });
          if (error) return null;
          return { key, value, shared: true };
        },
        async delete(key) {
          const { error } = await supabase.from("household_kv").delete().eq("household_id", householdId).eq("key", key);
          return { key, deleted: !error, shared: true };
        },
        async list(prefix) {
          const { data } = await supabase.from("household_kv").select("key").eq("household_id", householdId);
          const keys = (data || []).map((r) => r.key).filter((k) => !prefix || k.startsWith(prefix));
          return { keys, prefix, shared: true };
        },
      };

      // ---------- Receptfoto's ----------
      // In photo_url staan twee soorten waarden: een webadres van buiten
      // (begint met http) of een pad in ons eigen bakje. Het bakje staat
      // dicht, dus zo'n pad moet eerst omgezet worden in een tijdelijk adres.
      // Een pad is altijd "huishouden/recept.jpg" en kan dus nooit met http
      // beginnen; daarmee is het onderscheid hard en niet geraden.
      const FOTO_BAKJE = "recipe-photos";
      const FOTO_ADRES_GELDIG = 8 * 60 * 60;

      const isExternAdres = (waarde) => /^https?:\/\//i.test(String(waarde || ""));

      // Eén functie voor beide receptlijsten: anders zou de community-lijst
      // later wél of juist niet meegaan met een wijziging hier.
      async function fotoAdressen(rijen, alleenGedeelde = false) {
        const paden = [...new Set(
          (rijen || [])
            // Geen adres aanvragen voor een foto die we toch niet laten zien:
            // dat is een verzoek dat de server afwijst en dat niemand nodig had.
            .filter((r) => !alleenGedeelde || r.household_id === householdId || fotoMagNaarCommunity(r))
            .map((r) => r.photo_url)
            .filter((v) => v && !isExternAdres(v))
        )];
        if (!paden.length) return {};
        try {
          const { data, error } = await supabase.storage.from(FOTO_BAKJE)
            .createSignedUrls(paden, FOTO_ADRES_GELDIG);
          if (error || !data) return {};
          const kaart = {};
          data.forEach((d) => { if (d && d.path && d.signedUrl) kaart[d.path] = d.signedUrl; });
          return kaart;
        } catch (e) {
          // Geen adres betekent: geen foto tonen. De emoji neemt het over.
          console.warn("Fotoadressen konden niet worden opgehaald:", e);
          return {};
        }
      }

      // Mag deze foto bij een gedeeld recept aan andere huishoudens getoond
      // worden? Twee voorwaarden, en ze moeten allebei waar zijn:
      //
      //   1. Het is een foto in ons eigen bakje, geen adres van een site.
      //      Een foto van een receptensite doorgeven aan andere huishoudens is
      //      iets anders dan hem in je eigen kookboek als link laten staan.
      //   2. De maker heeft bevestigd dat hij de foto zelf gemaakt heeft en dat
      //      wij hem binnen Pollepel mogen tonen.
      //
      // Dit is hier alleen de nette weergave. De echte grens staat in de
      // leesregel op het opslagbakje: zonder bevestiging geeft de server geen
      // adres uit, wat de app van een ander huishouden ook vraagt. Deze
      // controle voorkomt alleen dat we om iets vragen dat toch geweigerd wordt.
      const fotoMagNaarCommunity = (rij) =>
        !!rij.photo_url && !isExternAdres(rij.photo_url) && !!rij.photo_own_confirmed_at;

      const fotoAdres = (waarde, kaart) =>
        !waarde ? "" : (isExternAdres(waarde) ? waarde : (kaart[waarde] || ""));

      // Alleen een echt id mag in een id-kolom. De app gebruikt bij een gekookte
      // avond ook het woord "geen" voor "er bleef niets over"; dat weigert de
      // database in een uuid-kolom, en dan ging de hele wijziging verloren.
      // Dat woord krijgt nu een eigen kolom (leftover_none).
      // Een schrijfactie die de database weigert of die onderweg mislukt, moet
      // een fout worden. Stil doorgaan betekent: in beeld staat iets wat de
      // database niet heeft, en dat merk je pas bij het volgende openen.
      const moet = (res) => { if (res && res.error) throw res.error; return res; };

      const alsId = (v) =>
        (typeof v === "string" && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)) ? v : null;

      window.dataAPI = {
        // ---------- Foto's ----------
        photos: {
          pad(recipeId) { return `${householdId}/${recipeId}.jpg`; },
          async upload(recipeId, blob) {
            const pad = `${householdId}/${recipeId}.jpg`;
            const { error } = await supabase.storage.from(FOTO_BAKJE)
              .upload(pad, blob, { contentType: "image/jpeg", upsert: true });
            if (error) throw error;
            return pad;
          },
          async remove(recipeId) {
            const pad = `${householdId}/${recipeId}.jpg`;
            const { error } = await supabase.storage.from(FOTO_BAKJE).remove([pad]);
            if (error) throw error;
          },
          // Voor een los adres dat verlopen is.
          async sign(pad) {
            if (!pad || isExternAdres(pad)) return pad || "";
            const { data, error } = await supabase.storage.from(FOTO_BAKJE)
              .createSignedUrl(pad, FOTO_ADRES_GELDIG);
            if (error || !data) return "";
            return data.signedUrl;
          },
        },

        // ---------- Recepten ----------
        recipes: {
          async list() {
            const { data: recs, error } = await supabase.from("recipes").select("*").eq("household_id", householdId).order("created_at");
            if (error || !recs) return [];
            const ids = recs.map((r) => r.id);
            const [{ data: ings }, { data: steps }, adressen] = await Promise.all([
              supabase.from("recipe_ingredients").select("*").in("recipe_id", ids.length ? ids : ["00000000-0000-0000-0000-000000000000"]).order("sort_order"),
              supabase.from("recipe_steps").select("*").in("recipe_id", ids.length ? ids : ["00000000-0000-0000-0000-000000000000"]).order("step_number"),
              fotoAdressen(recs),
            ]);
            return recs.map((r) => ({
              id: r.id,
              name: r.name,
              emoji: r.emoji,
              // photoPath is wat in de database staat, photoUrl is waar de
              // browser hem vandaan haalt. Bij een eigen foto verschillen die.
              photoPath: r.photo_url || "",
              photoUrl: fotoAdres(r.photo_url, adressen),
              photoOwnConfirmed: r.photo_own_confirmed_at || null,
              cookTime: r.cook_time,
              servings: r.servings,
              favorite: r.favorite,
              community: r.community,
              notes: r.notes || "",
              diets: r.diets || [],
              ingredients: (ings || []).filter((i) => i.recipe_id === r.id).map((i) => ({ name: i.name, amount: Number(i.amount), unit: i.unit, inventoryItemId: i.inventory_item_id || null })),
              steps: (steps || []).filter((s) => s.recipe_id === r.id).map((s) => s.content),
              nutrition: r.nutrition_calculated_at ? {
                kcal: Number(r.nutrition_kcal), proteinG: Number(r.nutrition_protein_g), carbsG: Number(r.nutrition_carbs_g),
                sugarsG: Number(r.nutrition_sugars_g), fiberG: Number(r.nutrition_fiber_g), fatG: Number(r.nutrition_fat_g),
                saturatedFatG: Number(r.nutrition_saturated_fat_g), saltG: Number(r.nutrition_salt_g),
                unmatched: r.nutrition_unmatched || [], matched: r.nutrition_matched || [],
                fingerprint: r.nutrition_fingerprint || null, coverage: r.nutrition_coverage,
                calculatedAt: r.nutrition_calculated_at,
              } : null,
            }));
          },
          async create(recipe) {
            const { data, error } = await supabase.from("recipes").insert({
              household_id: householdId, name: recipe.name, emoji: recipe.emoji, photo_url: recipe.photoPath || recipe.photoUrl || null, cook_time: recipe.cookTime,
              servings: recipe.servings, favorite: !!recipe.favorite, community: !!recipe.community,
              notes: recipe.notes || null, diets: recipe.diets || [],
            }).select().single();
            if (error) throw error;
            // Lukt het opslaan van ingrediënten of stappen niet, dan het recept
            // weer weghalen: anders staat er een leeg recept in je kookboek, en
            // levert "Opnieuw" er een tweede bij.
            try {
            if (recipe.ingredients && recipe.ingredients.length) {
              moet(await supabase.from("recipe_ingredients").insert(recipe.ingredients.map((ing, idx) => ({
                recipe_id: data.id, sort_order: idx, name: ing.name, amount: ing.amount, unit: ing.unit, inventory_item_id: ing.inventoryItemId || null,
              }))));
            }
            if (recipe.steps && recipe.steps.length) {
              moet(await supabase.from("recipe_steps").insert(recipe.steps.map((content, idx) => ({
                recipe_id: data.id, step_number: idx + 1, content,
              }))));
            }
            } catch (fout) {
              await supabase.from("recipes").delete().eq("id", data.id);
              throw fout;
            }
            return data.id;
          },
          async update(id, recipe) {
            const { error } = await supabase.from("recipes").update({
              name: recipe.name, emoji: recipe.emoji, photo_url: recipe.photoPath || recipe.photoUrl || null, cook_time: recipe.cookTime, servings: recipe.servings,
              favorite: !!recipe.favorite, community: !!recipe.community, notes: recipe.notes || null,
              diets: recipe.diets || [], updated_at: new Date().toISOString(),
            }).eq("id", id);
            if (error) throw error;
            if (recipe.ingredients) {
              moet(await supabase.from("recipe_ingredients").delete().eq("recipe_id", id));
              if (recipe.ingredients.length) {
                moet(await supabase.from("recipe_ingredients").insert(recipe.ingredients.map((ing, idx) => ({
                  recipe_id: id, sort_order: idx, name: ing.name, amount: ing.amount, unit: ing.unit, inventory_item_id: ing.inventoryItemId || null,
                }))));
              }
            }
            if (recipe.steps) {
              moet(await supabase.from("recipe_steps").delete().eq("recipe_id", id));
              if (recipe.steps.length) {
                moet(await supabase.from("recipe_steps").insert(recipe.steps.map((content, idx) => ({
                  recipe_id: id, step_number: idx + 1, content,
                }))));
              }
            }
          },
          async patch(id, fields) {
            // photoPath staat erbij zodat een foto met één regel bijgewerkt
            // wordt in plaats van via update(), die ook alle ingrediënten en
            // stappen opnieuw wegschrijft (werkafspraak 13).
            const map = {
              favorite: "favorite", community: "community", photoPath: "photo_url",
              // Een tijdstip of null. De database maakt dit vanzelf leeg zodra
              // de foto verandert, via een trigger — dan hoeft geen enkele
              // schrijfroute daar zelf aan te denken.
              photoOwnConfirmed: "photo_own_confirmed_at",
            };
            const dbFields = {};
            Object.keys(fields).forEach((k) => { if (map[k]) dbFields[map[k]] = fields[k]; });
            const { error } = await supabase.from("recipes").update(dbFields).eq("id", id);
            if (error) throw error;
          },
          async remove(id) {
            // Eerst de foto, dan het recept. Andersom weet niemand meer welk
            // bestand erbij hoorde en blijft het liggen tot het einde der
            // tijden — onvindbaar, maar het telt wel mee voor de opslag.
            try {
              const { data: rij } = await supabase.from("recipes").select("photo_url").eq("id", id).single();
              if (rij && rij.photo_url && !isExternAdres(rij.photo_url)) {
                await supabase.storage.from(FOTO_BAKJE).remove([rij.photo_url]);
              }
            } catch (e) {
              console.warn("Foto bij het recept kon niet worden opgeruimd:", e);
            }
            const { error } = await supabase.from("recipes").delete().eq("id", id);
            if (error) throw error;
          },
          async listCommunity() {
            const { data: recs, error } = await supabase.from("recipes").select("*").eq("community", true).order("created_at", { ascending: false });
            if (error || !recs) return [];
            const ids = recs.map((r) => r.id);
            const [{ data: ings }, { data: steps }, adressen] = await Promise.all([
              supabase.from("recipe_ingredients").select("*").in("recipe_id", ids.length ? ids : ["00000000-0000-0000-0000-000000000000"]).order("sort_order"),
              supabase.from("recipe_steps").select("*").in("recipe_id", ids.length ? ids : ["00000000-0000-0000-0000-000000000000"]).order("step_number"),
              fotoAdressen(recs, true),
            ]);
            return recs.map((r) => ({
              id: r.id, name: r.name, emoji: r.emoji,
              // Bij een recept van een ánder huishouden reist de foto alleen mee
              // als die van de maker zelf is (een pad in ons bakje, geen adres
              // van een site) én als hij heeft bevestigd dat we hem mogen tonen.
              // Je eigen gedeelde recepten laten we onveranderd zien: in je
              // eigen kookboek is een adres van een receptensite gewoon een link
              // naar hun site.
              photoPath: r.household_id === householdId ? (r.photo_url || "") : (fotoMagNaarCommunity(r) ? r.photo_url : ""),
              photoUrl: r.household_id === householdId
                ? fotoAdres(r.photo_url, adressen)
                : (fotoMagNaarCommunity(r) ? fotoAdres(r.photo_url, adressen) : ""),
              photoOwnConfirmed: r.photo_own_confirmed_at || null,
              cookTime: r.cook_time, servings: r.servings,
              favorite: false, community: true, notes: r.notes || "", diets: r.diets || [],
              ingredients: (ings || []).filter((i) => i.recipe_id === r.id).map((i) => ({ name: i.name, amount: Number(i.amount), unit: i.unit, inventoryItemId: i.inventory_item_id || null })),
              steps: (steps || []).filter((s) => s.recipe_id === r.id).map((s) => s.content),
              nutrition: r.nutrition_calculated_at ? {
                kcal: Number(r.nutrition_kcal), proteinG: Number(r.nutrition_protein_g), carbsG: Number(r.nutrition_carbs_g),
                sugarsG: Number(r.nutrition_sugars_g), fiberG: Number(r.nutrition_fiber_g), fatG: Number(r.nutrition_fat_g),
                saturatedFatG: Number(r.nutrition_saturated_fat_g), saltG: Number(r.nutrition_salt_g),
                unmatched: r.nutrition_unmatched || [], matched: r.nutrition_matched || [],
                fingerprint: r.nutrition_fingerprint || null, coverage: r.nutrition_coverage,
                calculatedAt: r.nutrition_calculated_at,
              } : null,
            }));
          },
        },

        // Koppelt één receptingrediënt aan een voorraaditem. Blijft bewaard, ook
        // als het recept een heel andere naam gebruikt dan jouw verpakking.
        async linkIngredient(recipeId, ingredientName, inventoryItemId) {
          const { error } = await supabase.from("recipe_ingredients")
            .update({ inventory_item_id: inventoryItemId })
            .eq("recipe_id", recipeId)
            .eq("name", ingredientName);
          if (error) throw error;
        },

        // ---------- Extra gerechten naast het avondeten ----------
        extras: {
          async list() {
            const { data } = await supabase.from("weekmenu_extras")
              .select("*").eq("household_id", householdId)
              .order("menu_date").order("sort_order");
            return (data || []).map((e) => ({
              id: e.id, date: e.menu_date, recipeId: e.recipe_id,
              label: e.label || "Extra", servings: e.servings, sortOrder: e.sort_order,
              // Een kliekje als extraatje. `kliekje` blijft staan, ook als de
              // database leftover_item_id leegmaakt: daaraan blijft hij
              // herkenbaar, en telt hij nooit mee voor de boodschappen.
              kliekje: !!e.kliekje,
              leftoverItemId: e.leftover_item_id || null,
              eatenAt: e.eaten_at || null,
            }));
          },
          async add({ date, recipeId, label, servings, sortOrder, kliekje, leftoverItemId }) {
            const { data, error } = await supabase.from("weekmenu_extras").insert({
              household_id: householdId, menu_date: date, recipe_id: recipeId || null,
              label: label || "Extra", servings: servings || null, sort_order: sortOrder || 0,
              kliekje: !!kliekje, leftover_item_id: kliekje ? (leftoverItemId || null) : null,
            }).select().single();
            if (error) throw error;
            return data.id;
          },
          async update(id, patch) {
            const dbPatch = {};
            if ("label" in patch) dbPatch.label = patch.label;
            if ("servings" in patch) dbPatch.servings = patch.servings;
            if ("recipeId" in patch) dbPatch.recipe_id = patch.recipeId;
            if ("eatenAt" in patch) dbPatch.eaten_at = patch.eatenAt || null;
            if ("leftoverItemId" in patch) dbPatch.leftover_item_id = patch.leftoverItemId || null;
            const { error } = await supabase.from("weekmenu_extras").update(dbPatch).eq("id", id);
            if (error) throw error;
          },
          async remove(id) {
            const { error } = await supabase.from("weekmenu_extras").delete().eq("id", id);
            if (error) throw error;
          },
        },

        // ---------- Kooksessies ----------
        // Legt vast wie wanneer aan welk gerecht begint, met een verwachte
        // klaartijd. Huisgenoten zien dat nu live in de app; straks is dit ook
        // de bron voor de pushmelding in de app-versie.
        cooking: {
          async start({ recipeId, recipeName, emoji, servings, cookTimeMinutes, cookName }) {
            const { data: userData } = await supabase.auth.getUser();
            const userId = userData && userData.user ? userData.user.id : null;
            const readyAt = cookTimeMinutes
              ? new Date(Date.now() + Number(cookTimeMinutes) * 60000).toISOString()
              : null;
            const { data, error } = await supabase.from("cooking_sessions").insert({
              household_id: householdId,
              user_id: userId,
              cook_name: cookName || null,
              recipe_id: recipeId || null,
              recipe_name: recipeName,
              emoji: emoji || null,
              servings: servings || null,
              cook_time_minutes: cookTimeMinutes || null,
              ready_at: readyAt,
            }).select().single();
            if (error) throw error;
            return data;
          },

          // Alleen sessies van de afgelopen paar uur die nog niet zijn afgerond.
          async active() {
            const grens = new Date(Date.now() - 4 * 60 * 60 * 1000).toISOString();
            const { data } = await supabase
              .from("cooking_sessions")
              .select("*")
              .is("finished_at", null)
              .gt("started_at", grens)
              .order("started_at", { ascending: false });
            return (data || []).map((s) => ({
              id: s.id, userId: s.user_id, cookName: s.cook_name,
              recipeId: s.recipe_id, recipeName: s.recipe_name, emoji: s.emoji,
              servings: s.servings, cookTimeMinutes: s.cook_time_minutes,
              startedAt: s.started_at, readyAt: s.ready_at,
            }));
          },

          async finish(recipeId) {
            if (!recipeId) return;
            await supabase.from("cooking_sessions")
              .update({ finished_at: new Date().toISOString() })
              .eq("household_id", householdId)
              .eq("recipe_id", recipeId)
              .is("finished_at", null);
          },
        },

        // ---------- Realtime: huisgenoten zien elkaars wijzigingen ----------
        // Zonder dit merk je pas na het herladen van de app dat je huisgenoot
        // iets op de boodschappenlijst heeft gezet — terwijl je in de winkel staat.
        realtime: {
          _channel: null,
          subscribe(onChange) {
            // Draait dit een tweede keer, dan het oude kanaal eerst opruimen.
            // Alleen "return" zou een dood abonnement achterlaten waarbij
            // wijzigingen stil niet meer binnenkomen.
            if (this._channel) {
              try { supabase.removeChannel(this._channel); } catch (e) { /* al weg */ }
              this._channel = null;
            }
            // Alleen de gedeelde tabellen: dat is waar samenwerking misgaat.
            const TABELLEN = [
              ["shopping_list_items", "shoppingList"],
              ["inventory_items", "inventory"],
              ["weekmenu_days", "weekmenu"],
              ["recipes", "recipes"],
              ["cooking_sessions", "cooking"],
              ["weekmenu_extras", "extras"],
            ];
            const channel = supabase.channel(`huishouden-${householdId}`);
            TABELLEN.forEach(([tabel, sleutel]) => {
              channel.on(
                "postgres_changes",
                { event: "*", schema: "public", table: tabel, filter: `household_id=eq.${householdId}` },
                (payload) => { try { onChange(sleutel, payload); } catch (e) { console.error("Realtime-verwerking mislukt:", e); } }
              );
            });
            // recipe_ingredients en recipe_steps hebben geen household_id;
            // die volgen we zonder filter en laten RLS het werk doen.
            ["recipe_ingredients", "recipe_steps"].forEach((tabel) => {
              channel.on(
                "postgres_changes",
                { event: "*", schema: "public", table: tabel },
                () => { try { onChange("recipes", null); } catch (e) { /* genegeerd */ } }
              );
            });
            channel.subscribe();
            this._channel = channel;
            return () => { try { supabase.removeChannel(channel); } catch (e) {} this._channel = null; };
          },
        },

            "verse dille": ["kruiden", "tuin"], "dille": ["kruiden", "tuin"],
            "verse peterselie": ["peterselie", "vers"], "peterselie": ["peterselie", "vers"],
          },

          // Ruwe Nederlandse enkelvoudsvorm — genoeg voor substring-zoeken.
          singularize(w) {
            if (w.length <= 3) return w;
            if (/tten$/.test(w)) return w.slice(0, -3);          // ritten -> rit
            if (/([bdfgklmnprst])\1en$/.test(w)) return w.slice(0, -3); // bollen -> bol
            if (/ien$/.test(w)) return w.slice(0, -3) + "ie";
            if (/en$/.test(w)) {
              const stem = w.slice(0, -2);
              // aardappelen -> aardappel, tomaten -> tomaat (open lettergreep)
              if (/[aeiou][bcdfghjklmnpqrstvwxz]$/.test(stem) && stem.length >= 4) {
                return stem.slice(0, -1) + stem.slice(-2, -1) + stem.slice(-1);
              }
              return stem;
            }
            if (/jes$/.test(w)) return w.slice(0, -3);
            if (/s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
            return w;
          },

          normalize(s) {
            return (s || "").toLowerCase()
              .replace(/\(.*?\)/g, " ")
              .replace(/[^a-zà-ÿ\s-]/g, " ")
              .replace(/-+/g, " ")   // NEVO schrijft "Room kook-", "Bonen sperzie-"
              .replace(/\s+/g, " ")
              .trim();
          },

          contentWords(term) {
            // "(blik)" is betekenisvol: het onderscheidt blik van gedroogd/vers.
            const withParens = (term || "").toLowerCase().replace(/[()]/g, " ");
            const clean = this.normalize(withParens);
            if (this.SYNONYMS[clean]) return this.SYNONYMS[clean];
            const words = clean.split(" ").filter(Boolean);
            const kept = words.filter((w) => !this.NOISE.includes(w));
            const base = kept.length ? kept : words;
            // laatste kans: losse woorden die wél een synoniem hebben
            const out = [];
            base.forEach((w) => {
              if (this.SYNONYMS[w]) out.push(...this.SYNONYMS[w]);
              else out.push(w);
            });
            // dedupliceer, en voeg enkelvoudsvormen toe voor het zoeken
            return [...new Set(out)];
          },

          searchWords(term) {
            const words = this.contentWords(term);
            const withSingular = [];
            words.forEach((w) => {
              withSingular.push(w);
              const s = this.singularize(w);
              if (s !== w && s.length >= 3) withSingular.push(s);
            });
            return [...new Set(withSingular)];
          },

          gramsForIngredient(ing) {
            const unit = (ing.unit || "").toLowerCase();
            const amount = Number(ing.amount || 0);
            if (this.UNIT_GRAMS[unit] != null) return amount * this.UNIT_GRAMS[unit];
            if (unit !== "stuks") return null;
            // Woordenset inclusief enkelvouden en synoniemen, zodat "Wraps" en
            // "Kidneybonen (blik)" ook een stukgewicht vinden.
            const withParens = (ing.name || "").toLowerCase().replace(/[()]/g, " ");
            const raw = this.normalize(withParens).split(" ").filter(Boolean);
            const words = new Set();
            raw.concat(this.contentWords(ing.name)).forEach((w) => {
              words.add(w);
              const s = this.singularize(w);
              if (s.length >= 2) words.add(s);
            });
            let best = null;
            for (const [key, grams] of this.STUKS_GRAMS) {
              const keyWords = key.split(" ");
              const hit = keyWords.every((kw) => words.has(kw) || words.has(this.singularize(kw)));
              // specifiekere sleutel wint: "tomatenblokjes" (blik) boven "tomaat" (stuk)
              if (hit && (!best || key.length > best.len)) best = { grams, len: key.length };
            }
            return best ? amount * best.grams : null;
          },

          async searchCandidates(term) {
            const words = this.searchWords(term);
            if (!words.length) return [];
            // Zoek op elk inhoudelijk woord apart (OR), zodat "rode ui" ook op "ui" zoekt.
            const filter = words.map((w) => `name_nl.ilike.%${w}%`).join(",");
            const { data } = await supabase
              .from("nutrition_reference")
              .select("id, nevo_code, name_nl, kcal, protein_g, carbs_g, sugars_g, fiber_g, fat_g, saturated_fat_g, salt_g")
              .or(filter)
              .limit(300);
            return data || [];
          },

          // Woorden die duiden op een samengesteld gerecht in plaats van een basisproduct.
          DISH_WORDS: ["bolognese", "carbonara", "huishoudelijk", "bereid", "kant-en-klaar",
                       "maaltijd", "schotel", "ovenschotel", "salade", "soep", "saus", "gerecht",
                       "koelverse", "cordon", "gevuld", "gevulde", "pizza", "wrap", "sandwich",
                       "tosti", "broodje", "taart", "cake", "koek", "biscuit", "reep", "candybar",
                       "babyvoeding", "zuigelingenvoeding", "opvolgmelk", "dreumesmelk", "peutermelk",
                       "vegetarisch", "vegetarische", "plantaardig"],

          PREP_WORDS: ["blik", "glas", "diepvries", "gefrituurd", "gebakken", "gekookt", "gestoofd",
                       "gezouten", "gerookt", "siroop", "zoetzuur", "poeder", "gedroogd", "gedroogde",
                       "instant", "magnetron", "gegrild", "gepaneerd", "gepoft"],

          scoreCandidate(ingredientWords, candidate) {
            const rawName = this.normalize(candidate.name_nl);
            const nameWords = rawName.split(" ").filter(Boolean);
            if (!nameWords.length) return -1;
            const head = nameWords[0];
            const ingSingular = ingredientWords.map((w) => this.singularize(w));
            const matchesWord = (target) => {
              const t = this.singularize(target);
              return ingredientWords.includes(target) || ingSingular.includes(t) ||
                     ingredientWords.some((w) => this.singularize(w) === t);
            };
            let score = 0;

            // Exacte naamgelijkheid is het sterkste signaal
            if (rawName === ingredientWords.join(" ")) score += 14;

            // NEVO zet het hoofdproduct vooraan: "Ui rode rauw", "Gehakt runder- rauw".
            if (matchesWord(head)) score += 10;
            else if (ingredientWords.some((w) => w.length >= 4 && (head.startsWith(w) || w.startsWith(head)))) score += 5;
            else score -= 2;

            // Overige overlappende woorden (bijv. "feta" in "Kaas Feta")
            let extra = 0;
            nameWords.slice(1).forEach((nw) => {
              if (matchesWord(nw)) extra += 6;
              else if (ingredientWords.some((w) => w.length >= 5 && nw.startsWith(w))) extra += 1;
            });
            score += Math.min(extra, 12);

            // Generieke/onbewerkte varianten hebben de voorkeur
            if (nameWords.includes("gem")) score += 3;
            if (nameWords.includes("naturel")) score += 3;
            if (nameWords.includes("rauw")) score += 2;
            if (nameWords.includes("onbereid")) score += 1.5;
            // "m" = met: "Wrap m kip" is een gevuld gerecht, geen basisproduct
            if (nameWords.includes("m") && nameWords.length > 2) score -= 4;

            // Samengestelde gerechten zwaar afstraffen als het ingrediënt dat niet vraagt
            this.DISH_WORDS.forEach((bad) => {
              if (nameWords.includes(bad) && !ingredientWords.includes(bad)) score -= 7;
            });
            this.PREP_WORDS.forEach((bad) => {
              if (nameWords.includes(bad) && !ingredientWords.includes(bad)) score -= 2;
            });

            // Kortere namen zijn doorgaans de generieke basisproducten
            score -= Math.max(0, nameWords.length - 3) * 0.8;
            return score;
          },

          pickBestMatch(ingredientName, candidates) {
            if (!candidates.length) return null;
            const words = this.contentWords(ingredientName);
            let best = null, bestScore = -Infinity;
            for (const c of candidates) {
              const s = this.scoreCandidate(words, c);
              if (s > bestScore) { bestScore = s; best = c; }
            }
            return bestScore >= 8 ? best : null; // hoofdproduct moet echt raak zijn
          },

          async matchIngredient(ing) {
            const grams = this.gramsForIngredient(ing);
            if (grams == null) return { ing, grams: null, match: null, reason: "eenheid" };
            const candidates = await this.searchCandidates(ing.name);
            const match = this.pickBestMatch(ing.name, candidates);
            if (!match) return { ing, grams, match: null, reason: "product" };
            return { ing, grams, match, reason: null };
          },

          async calculateForRecipe(recipe) {
            const ings = recipe.ingredients || [];
            // parallel, scheelt flink bij lange ingrediëntenlijsten
            const results = await Promise.all(ings.map((ing) => this.matchIngredient(ing)));
            const totals = { kcal: 0, protein_g: 0, carbs_g: 0, sugars_g: 0, fiber_g: 0, fat_g: 0, saturated_fat_g: 0, salt_g: 0 };
            const unmatched = [];
            const matched = [];
            for (const r of results) {
              if (!r.match || r.grams == null) { unmatched.push(r.ing.name); continue; }
              const f = r.grams / 100;
              totals.kcal += (Number(r.match.kcal) || 0) * f;
              totals.protein_g += (Number(r.match.protein_g) || 0) * f;
              totals.carbs_g += (Number(r.match.carbs_g) || 0) * f;
              totals.sugars_g += (Number(r.match.sugars_g) || 0) * f;
              totals.fiber_g += (Number(r.match.fiber_g) || 0) * f;
              totals.fat_g += (Number(r.match.fat_g) || 0) * f;
              totals.saturated_fat_g += (Number(r.match.saturated_fat_g) || 0) * f;
              totals.salt_g += (Number(r.match.salt_g) || 0) * f;
              matched.push({ ingredient: r.ing.name, grams: Math.round(r.grams), nevo: r.match.name_nl, nevoCode: r.match.nevo_code });
            }
            const servings = recipe.servings || 1;
            const perPortion = {};
            Object.keys(totals).forEach((k) => { perPortion[k] = Math.round((totals[k] / servings) * 10) / 10; });
            // Dekking op basis van gewicht, niet op aantal ingrediënten: één gemiste
            // zak pasta weegt zwaarder dan drie gemiste kruiden.
            const gramsMatched = results.reduce((s, r) => s + (r.match && r.grams ? r.grams : 0), 0);
            const gramsTotal = results.reduce((s, r) => s + (r.grams || 0), 0);
            const coverage = gramsTotal > 0 ? gramsMatched / gramsTotal : 0;
            const reliable = coverage >= 0.7 && unmatched.length <= Math.max(1, Math.floor(ings.length * 0.34));
            return { perPortion, unmatched, matched, coverage: Math.round(coverage * 100), reliable };
          },

          // Vingerafdruk van de ingrediënten: verandert die, dan is de berekening verouderd.
          fingerprint(recipe) {
            return (recipe.ingredients || [])
              .map((i) => `${(i.name || "").toLowerCase()}|${i.amount}|${i.unit}`)
              .join("~") + `#${recipe.servings || 1}`;
          },

          async save(recipeId, perPortion, unmatched, matched, fingerprint, coverage) {
            const { error } = await supabase.from("recipes").update({
              nutrition_kcal: perPortion.kcal, nutrition_protein_g: perPortion.protein_g, nutrition_carbs_g: perPortion.carbs_g,
              nutrition_sugars_g: perPortion.sugars_g, nutrition_fiber_g: perPortion.fiber_g, nutrition_fat_g: perPortion.fat_g,
              nutrition_saturated_fat_g: perPortion.saturated_fat_g, nutrition_salt_g: perPortion.salt_g,
              nutrition_unmatched: unmatched, nutrition_matched: matched, nutrition_coverage: coverage,
              nutrition_fingerprint: fingerprint, nutrition_calculated_at: new Date().toISOString(),
            }).eq("id", recipeId);
            if (error) throw error;
          },
        },

        // ---------- Weekmenu ----------
        weekmenu: {
          // Sleutel is nu de datum (YYYY-MM-DD) in plaats van een dagcode,
          // zodat er vooruit gepland kan worden en het verleden blijft staan.
          async list(table) {
            const t = table || "weekmenu_days";
            const { data, error } = await supabase.from(t).select("*").eq("household_id", householdId);
            if (error || !data) return {};
            const obj = {};
            data.forEach((d) => {
              const sleutel = d.menu_date || d.day_key;
              if (!sleutel) return;
              obj[sleutel] = {
                recipeId: d.recipe_id, cook: d.cook || "", attendees: d.attendees || [],
                offNight: !!d.off_night, doublePortion: !!d.double_portion,
                leftoverItemId: d.leftover_item_id || null,
                cookedAt: d.cooked_at || null,
                eatenAt: d.eaten_at || null,
                producedLeftoverId: d.produced_leftover_id || (d.leftover_none ? "geen" : null),
                cookSkipped: !!d.cook_skipped,
              };
            });
            return obj;
          },
          async setDay(datum, entry, table) {
            const t = table || "weekmenu_days";
            // Alleen het echte weekmenu houdt bij of een avond is afgeboekt.
            // De sjabloontabel kent die kolom niet, en een sjabloon hoort ook
            // geen kooksporen te bewaren.
            const houdtGekooktBij = t === "weekmenu_days";
            const { error } = await supabase.from(t).upsert({
              household_id: householdId, menu_date: datum, recipe_id: entry.recipeId || null,
              cook: entry.cook || null, attendees: entry.attendees || [],
              off_night: !!entry.offNight, double_portion: !!entry.doublePortion,
              leftover_item_id: entry.leftoverItemId || null,
              ...(houdtGekooktBij ? {
                cooked_at: entry.cookedAt || null,
                // Altijd meeschrijven, ook als hij leeg is: een avond die een
                // ander gerecht krijgt moet zijn "opgegeten" kwijtraken.
                eaten_at: entry.eatenAt || null,
                produced_leftover_id: alsId(entry.producedLeftoverId),
                leftover_none: entry.producedLeftoverId === "geen",
                cook_skipped: !!entry.cookSkipped,
              } : {}),
            }, { onConflict: "household_id,menu_date" });
            if (error) throw error;
          },
          async clearDay(datum, table) {
            const t = table || "weekmenu_days";
            const { error } = await supabase.from(t).delete().eq("household_id", householdId).eq("menu_date", datum);
            if (error) throw error;
          },
          async replaceAll(days, table) {
            const t = table || "weekmenu_days";
            const houdtGekooktBij = t === "weekmenu_days";
            moet(await supabase.from(t).delete().eq("household_id", householdId));
            // Niet alleen op recipeId of offNight filteren: een dag waarop
            // alleen al bekend is wie kookt, wie mee-eet of welk kliekje er
            // gepland staat hoort ook bewaard te worden. Die filter gooide dat
            // stil weg, waardoor de naam even in beeld stond en bij de
            // volgende verversing verdwenen was.
            const heeftInhoud = (v) => !!(v && (
              v.recipeId || v.offNight || v.leftoverItemId ||
              (v.cook && String(v.cook).trim()) ||
              (Array.isArray(v.attendees) && v.attendees.length) ||
              v.doublePortion || v.cookedAt || v.producedLeftoverId || v.cookSkipped || v.eatenAt
            ));
            const rows = Object.entries(days)
              .filter(([, v]) => heeftInhoud(v))
              .map(([datum, v]) => ({
                household_id: householdId, menu_date: datum, recipe_id: v.recipeId || null,
                cook: v.cook || null, attendees: v.attendees || [],
                off_night: !!v.offNight, double_portion: !!v.doublePortion,

                  cooked_at: v.cookedAt || null,
                  eaten_at: v.eatenAt || null,
                  produced_leftover_id: alsId(v.producedLeftoverId),
                  leftover_none: v.producedLeftoverId === "geen",
                  cook_skipped: !!v.cookSkipped,
                } : {}),
              }));
            if (rows.length) moet(await supabase.from(t).insert(rows));
          },

            if (error) throw error;
          },
          // Het verbruik van een teruggedraaide kookbeurt. Op naam, eenheid,
          // hoeveelheid en tijdstip: een id heeft de app in het geheugen niet,
          // maar het tijdstip is van de app zelf en komt exact overeen.
          async removeEntries(entries) {
            for (const e of entries || []) {
              if (!e || !e.date) continue;
              const { error } = await supabase.from("consumption_log").delete()
                .eq("household_id", householdId).eq("name", e.name).eq("unit", e.unit)
                .eq("amount", e.amount).eq("logged_at", e.date);
              if (error) throw error;
            }
          },
        },

        // ---------- Voorkeuren ----------
        preferences: {
          async get() {
            const { data } = await supabase.from("household_preferences").select("*").eq("household_id", householdId).maybeSingle();
            if (!data) return { darkMode: false, categoryOrder: null, diets: [], dislikes: [], premium: { photoInventory: true, predictiveDepletion: true, householdRSVP: true, sousChef: true }, welcomeSeen: false, shoppingDay: 6, containerNumbering: false, containerCount: 40, containerHintSeen: false, weekdayStyles: null, weekdaySoorten: null, personsPerPortion: 1 };
            return { darkMode: data.dark_mode, categoryOrder: data.category_order, diets: data.diets || [], dislikes: data.dislikes || [], premium: data.premium || {}, welcomeSeen: data.welcome_seen === true, shoppingDay: data.shopping_day == null ? 6 : Number(data.shopping_day), shoppingDaysExtra: Array.isArray(data.shopping_days_extra) ? data.shopping_days_extra : [], containerNumbering: data.container_numbering === true, containerCount: data.container_count == null ? 40 : Number(data.container_count), containerHintSeen: data.container_hint_seen === true, weekdayStyles: Array.isArray(data.weekday_styles) && data.weekday_styles.length === 7 ? data.weekday_styles : null, weekdaySoorten: Array.isArray(data.weekday_soorten) && data.weekday_soorten.length === 7 ? data.weekday_soorten : null, personsPerPortion: data.persons_per_portion == null ? 1 : Number(data.persons_per_portion) };
          },
          async update(patch) {
            const dbPatch = {};
            if ("darkMode" in patch) dbPatch.dark_mode = patch.darkMode;
            if ("categoryOrder" in patch) dbPatch.category_order = patch.categoryOrder;
            if ("diets" in patch) dbPatch.diets = patch.diets;
            if ("dislikes" in patch) dbPatch.dislikes = patch.dislikes;
            if ("premium" in patch) dbPatch.premium = patch.premium;
            if ("welcomeSeen" in patch) dbPatch.welcome_seen = patch.welcomeSeen;
            if ("shoppingDay" in patch) dbPatch.shopping_day = patch.shoppingDay;
            if ("shoppingDaysExtra" in patch) {
              // De database weigert een lege plek, een dubbele dag en de
              // hoofddag in deze lijst. Hier alvast opruimen, zodat een
              // onbedoelde waarde geen opslagfout wordt maar gewoon verdwijnt.
              dbPatch.shopping_days_extra = [...new Set(
                (patch.shoppingDaysExtra || [])
                  .map((d) => (typeof d === "number" ? d : (typeof d === "string" && d.trim() !== "" ? Number(d) : NaN)))
                  .filter((n) => Number.isInteger(n) && n >= 0 && n <= 6)
              )];
              // Komt de hoofddag in dezelfde wijziging mee, haal hem er dan
              // uit: hij hoort in shopping_day en niet nog eens hier.
              if ("shoppingDay" in patch) {
                dbPatch.shopping_days_extra = dbPatch.shopping_days_extra.filter((d) => d !== Number(patch.shoppingDay));
              }
            }
            if ("containerNumbering" in patch) dbPatch.container_numbering = patch.containerNumbering;
            if ("containerCount" in patch) dbPatch.container_count = patch.containerCount;
            if ("containerHintSeen" in patch) dbPatch.container_hint_seen = patch.containerHintSeen;
            if ("weekdayStyles" in patch) dbPatch.weekday_styles = patch.weekdayStyles;
            if ("weekdaySoorten" in patch) dbPatch.weekday_soorten = patch.weekdaySoorten;
            // Hoeveel mensen er van één portie eten. Hangt af van de bakjes die
            // een huishouden gebruikt, niet van het recept.
            if ("personsPerPortion" in patch) {
              const n = Number(patch.personsPerPortion);
              dbPatch.persons_per_portion = Number.isInteger(n) && n >= 1 && n <= 4 ? n : 1;
            }

            // Waarschuw als er een voorkeur wordt opgeslagen die hier niet bekend is.
            // Die verdween voorheen geruisloos, zoals welcomeSeen deed.
            const BEKEND = ["darkMode", "categoryOrder", "diets", "dislikes", "premium", "welcomeSeen", "shoppingDay", "shoppingDaysExtra", "containerNumbering", "containerCount", "containerHintSeen", "weekdayStyles", "weekdaySoorten", "personsPerPortion"];
            Object.keys(patch).forEach((k) => {
              if (!BEKEND.includes(k)) console.error(`Voorkeur "${k}" wordt niet opgeslagen: onbekend veld in preferences.update().`);
            });
            const { error } = await supabase.from("household_preferences").upsert({ household_id: householdId, ...dbPatch }, { onConflict: "household_id" });
            if (error) throw error;
          },
        },
      };

      window.communityStore = {
        async list() {
          const { data, error } = await supabase.from("community_recipes").select("recipe_id, recipe").order("created_at", { ascending: false });
          if (error) return [];
          return (data || []).map((row) => ({ ...row.recipe, id: row.recipe_id, community: true }));
        },
        async publish(recipe) {
          const { error } = await supabase.from("community_recipes").upsert({
            household_id: householdId,
            recipe_id: recipe.id,
            recipe,
            updated_at: new Date().toISOString(),
          }, { onConflict: "household_id,recipe_id" });
          if (error) throw error;
        },
        async unpublish(recipeId) {
          await supabase.from("community_recipes").delete().eq("household_id", householdId).eq("recipe_id", recipeId);
        },
      };

      window.householdAPI = {
        householdId,
        async getInfo() {
          const { data, error } = await supabase.from("households")
            .select("name, invite_code, calendar_token, premium_until, premium_source, data_consent_at, data_consent_version, data_consent_withdrawn_at, region_pc2, adults, children")
            .eq("id", householdId).maybeSingle();
          if (error || !data) throw new Error("kon huishouden niet ophalen");
          return data;
        },

        // ---------- Toestemming en geanonimiseerd logboek ----------
        //
        // Het logboek kent het huishouden niet. Er wordt eerst een pseudoniem
        // opgehaald of aangemaakt, en alleen dat pseudoniem gaat mee de regels
        // in. De database bewaakt zelf dat er niets geschreven wordt zonder
        // geldige toestemming — dat mag niet alleen van de app afhangen.
        async setDataConsent(aan, versie) {
          const velden = aan
            ? { data_consent_at: new Date().toISOString(), data_consent_version: versie, data_consent_withdrawn_at: null }
            : { data_consent_withdrawn_at: new Date().toISOString() };
          const { error } = await supabase.from("households").update(velden).eq("id", householdId);
          if (error) throw error;
        },

        async setHouseholdFacts({ regionPc2, adults, children }) {
          const velden = {};
          if (regionPc2 !== undefined) velden.region_pc2 = regionPc2 || null;
          if (adults !== undefined) velden.adults = adults == null ? null : Number(adults);
          if (children !== undefined) velden.children = children == null ? null : Number(children);
          if (!Object.keys(velden).length) return;
          const { error } = await supabase.from("households").update(velden).eq("id", householdId);
          if (error) throw error;
        },

        async getAnalyticsKey() {
          const { data } = await supabase.from("analytics_keys").select("analytics_key").eq("household_id", householdId).maybeSingle();
          if (data && data.analytics_key) return data.analytics_key;
          const { data: nieuw, error } = await supabase.from("analytics_keys")
            .insert({ household_id: householdId }).select("analytics_key").single();
          if (error) return null;
          return nieuw ? nieuw.analytics_key : null;
        },

        async logEvents(rows) {
          if (!rows || !rows.length) return;
          const key = await this.getAnalyticsKey();
          if (!key) return;
          // Mislukt dit, dan gebeurt er verder niets. Een logboek mag nooit
          // in de weg zitten van waar de gebruiker mee bezig is.
          await supabase.from("analytics_events").insert(
            rows.map((r) => ({
              analytics_key: key,
              event: r.event,
              product: r.product || null,
              amount: r.amount == null ? null : r.amount,
              unit: r.unit || null,
              eters: r.eters == null ? null : r.eters,
              meta: r.meta || {},
            }))
          );
        },

        async myEvents(limit) {
          const { data } = await supabase.from("analytics_events")
            .select("occurred_at, event, product, amount, unit, eters, meta")
            .order("occurred_at", { ascending: false }).limit(limit || 50);
          return data || [];
        },
        async updateName(name) {
          const { error } = await supabase.from("households").update({ name }).eq("id", householdId);
          if (error) throw error;
        },
        async getMembers() {
          const { data: memberRows, error: memberErr } = await supabase.from("household_members").select("user_id, role, created_at").eq("household_id", householdId);
          if (memberErr || !memberRows) return [];
          const userIds = memberRows.map((m) => m.user_id);
          const { data: profileRows } = await supabase.from("profiles").select("id, email, display_name").in("id", userIds);
          const profileMap = {};
          (profileRows || []).forEach((p) => { profileMap[p.id] = p; });
          return memberRows.map((m) => ({
            userId: m.user_id,
            role: m.role,
            email: profileMap[m.user_id] ? profileMap[m.user_id].email : "",
            displayName: profileMap[m.user_id] ? profileMap[m.user_id].display_name : "",
          }));
        },
        async getCurrentUserEmail() {
          const { data } = await supabase.auth.getUser();
          return data && data.user ? data.user.email : "";
        },
        async getAccessToken() {
          const { data } = await supabase.auth.getSession();
          return data && data.session ? data.session.access_token : null;
        },
        // Verwijdert het account onherroepelijk. Ben je de laatste in je
        // huishouden, dan verdwijnt het hele huishouden mee.
        async deleteAccount() {
          const { data, error } = await supabase.rpc("delete_my_account");
          if (error) throw error;
          if (!data || !data.ok) throw new Error(data && data.reden ? data.reden : "verwijderen mislukt");
          try { await supabase.auth.signOut(); } catch (e) { /* account is al weg */ }
          return data;
        },
        async signOut() {
          await supabase.auth.signOut();
          window.location.reload();
        },
      };
    }

    function Root() {
      const [phase, setPhase] = useState("loading"); // loading | auth | household | ready
      const [householdId, setHouseholdId] = useState(null);
      const [household, setHousehold] = useState(null);
      const [members, setMembers] = useState([]);

      const loadHouseholdMeta = async () => {
        try {
          const info = await window.householdAPI.getInfo();
          setHousehold(info);
        } catch (e) { /* stil negeren */ }
        try {
          const m = await window.householdAPI.getMembers();
          setMembers(m);
        } catch (e) { /* stil negeren */ }
      };

      const checkHousehold = async () => {
        const { data, error } = await supabase.from("household_members").select("household_id").limit(1).maybeSingle();
        if (error || !data) { setPhase("household"); return; }
        setupBackend(data.household_id);
        setHouseholdId(data.household_id);
        setPhase("ready");
      };

      useEffect(() => {
        supabase.auth.getSession().then(({ data }) => {
          if (data.session) checkHousehold();
          else setPhase("auth");
        });
        const { data: sub } = supabase.auth.onAuthStateChange((_event, session) => {
          if (session && phase === "auth") checkHousehold();
        });
        return () => sub.subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (phase === "ready" && householdId) loadHouseholdMeta();
      }, [phase, householdId]);

      const handleRename = async (newName) => {
        await window.householdAPI.updateName(newName);
        setHousehold((prev) => ({ ...prev, name: newName }));
      };

      if (phase === "loading") return React.createElement(Shell, null, React.createElement("p", { style: { textAlign: "center", color: C.inkSoft } }, "Laden…"));
      if (phase === "auth") return React.createElement(AuthScreen, { onAuthed: checkHousehold });
      if (phase === "household") return React.createElement(HouseholdScreen, { onReady: (id) => { setupBackend(id); setHouseholdId(id); setPhase("ready"); } });
      return React.createElement(App, {
        household,
        members,
        onRenameHousehold: handleRename,
        onLogout: () => window.householdAPI.signOut(),
      });
    }

    // Vangnet voor fouten die gebeuren vóórdat de app draait: een app.js die
    // niet laadt, of een fout tijdens het opstarten. Zonder dit blijft er een
    // leeg wit scherm over.
    function toonOpstartfout(fout) {
      const root = document.getElementById("root");
      if (!root || root.dataset.fout === "1") return;
      root.dataset.fout = "1";
      root.innerHTML = `
        <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;
                    padding:24px;font-family:'Work Sans',sans-serif;background:#EAE7DC;color:#1C1D1B;">
          <div style="max-width:420px;text-align:center;">
            <div style="font-size:34px;margin-bottom:10px;">🥄</div>
            <h1 style="font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px;">
              Pollepel kon niet opstarten
            </h1>
            <p style="font-size:14px;color:#6B6B63;line-height:1.55;margin:0 0 18px;">
              Je gegevens staan veilig op de server — er is niets kwijt.
              Controleer je verbinding en probeer het opnieuw.
            </p>
            <button onclick="window.location.reload()"
              style="background:#1F3F66;color:#fff;border:none;border-radius:12px;padding:12px 18px;
                     font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px;">
              Opnieuw proberen
            </button>
            <details style="margin-top:18px;text-align:left;">
              <summary style="font-size:12px;color:#6B6B63;cursor:pointer;">Technische details</summary>
              <pre style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6B6B63;
                          white-space:pre-wrap;word-break:break-word;margin-top:6px;">${String(fout || "onbekende fout")}</pre>
            </details>
          </div>
        </div>`;
    }

    window.addEventListener("error", (e) => {
      if (!document.getElementById("root").hasChildNodes()) toonOpstartfout(e.message);
    });

    try {
      createRoot(document.getElementById("root")).render(React.createElement(Root));
    } catch (e) {
      console.error("Opstarten mislukt:", e);
      toonOpstartfout(e && (e.stack || e.message));
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          // Er staat al een nieuwe versie klaar bij het openen
          if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg);

          reg.addEventListener("updatefound", () => {
            const nieuwe = reg.installing;
            if (!nieuwe) return;
            nieuwe.addEventListener("statechange", () => {
              // Alleen melden als er al een versie draaide; bij een eerste
              // bezoek is dit gewoon de installatie en valt er niets te melden.
              if (nieuwe.state === "installed" && navigator.serviceWorker.controller) showUpdateBar(reg);
            });
          });
        }).catch(() => {});
      });

      let herladen = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (herladen) return;
        herladen = true;
        window.location.reload();
      });
    }

    // Onopvallende balk onderin: de gebruiker bepaalt zelf wanneer hij vernieuwt,
    // zodat een halfingevuld formulier niet zomaar verdwijnt.
    function showUpdateBar(reg) {
      if (document.getElementById("pollepel-update-bar")) return;
      const bar = document.createElement("div");
      bar.id = "pollepel-update-bar";
      bar.setAttribute("role", "status");
      bar.style.cssText = [
        "position:fixed", "left:12px", "right:12px", "bottom:12px", "z-index:9999",
        "background:#1F3F66", "color:#F6F4EE", "border-radius:14px",
        "padding:12px 14px", "display:flex", "align-items:center", "gap:10px",
        "font-family:'Work Sans',sans-serif", "font-size:14px",
        "box-shadow:0 6px 20px rgba(0,0,0,0.18)", "max-width:460px", "margin:0 auto",
      ].join(";");

      const tekst = document.createElement("span");
      tekst.textContent = "Er is een nieuwe versie van Pollepel.";
      tekst.style.flex = "1";

      const knop = document.createElement("button");
      knop.textContent = "Vernieuwen";
      knop.style.cssText = [
        "background:#D9A441", "color:#fff", "border:none", "border-radius:10px",
        "padding:8px 14px", "font-weight:600", "font-size:13.5px", "cursor:pointer",
        "font-family:'Work Sans',sans-serif", "flex-shrink:0",
      ].join(";");
      knop.onclick = () => {
        knop.disabled = true;
        knop.textContent = "Bezig…";
        if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
        else window.location.reload();
      };

      const later = document.createElement("button");
      later.textContent = "Later";
      later.setAttribute("aria-label", "Melding sluiten");
      later.style.cssText = [
        "background:none", "border:none", "color:#F6F4EE", "opacity:0.7",
        "font-size:13px", "cursor:pointer", "font-family:'Work Sans',sans-serif", "flex-shrink:0",
      ].join(";");
      later.onclick = () => bar.remove();

      bar.appendChild(tekst);
      bar.appendChild(later);
      bar.appendChild(knop);
      document.body.appendChild(bar);
    }
  </script>
</body>
</html>
