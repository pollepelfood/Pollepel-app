# Pollepel — Netlify-instellingen
#
# Netlify breekt een functie standaard na 10 seconden af. Een AI-aanroep die
# een heel recept genereert zit daar vlak tegenaan, waardoor sommige pogingen
# halverwege sneuvelen met een 504.
#
# Deze instelling vraagt 26 seconden aan — het maximum. Let op: dat wordt
# alleen toegekend op een betaald Netlify-plan, en je moet het daarnaast bij
# Netlify aanvragen via hun support. Op het gratis plan heeft deze regel geen
# effect, maar hij doet ook geen kwaad.

[functions."ask-claude"]
  timeout = 26

[build]
  publish = "."

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
