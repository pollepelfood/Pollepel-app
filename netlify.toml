# Pollepel — Netlify-instellingen
#
# Dit bestand doet bewust maar één ding: Netlify vertellen waar de serverloze
# functies staan. In het opleveringslogboek ontbrak elke regel over het
# verpakken van functies, wat betekent dat die map niet werd gevonden.
#
# Let op: hier staat GEEN publish-regel. Een eerdere versie van dit bestand
# had die wel, en die overschreef de publicatiemap waardoor de site offline
# ging. Wat er niet in staat, kan ook niets breken.

[build]
  functions = "netlify/functions"

# De tijdslimiet van een functie staat standaard op 10 seconden. Een AI-aanroep
# zit daar vlak tegenaan. 26 seconden is het maximum, maar wordt alleen
# toegekend op een betaald plan; op het gratis plan heeft dit geen effect en
# doet het ook geen kwaad.
[functions."ask-claude"]
  timeout = 26

# Voorkomt dat de browser oude code blijft serveren na een oplevering.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
