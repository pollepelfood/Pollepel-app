# Pollepel — Netlify-instellingen
#
# Dit bestand doet bewust maar één ding: Netlify vertellen waar de serverloze
# functies staan. In het opleveringslogboek ontbrak elke regel over het
# verpakken van functies, wat betekent dat die map niet werd gevonden.
#
# Let op: hier staat GEEN publish-regel. Een eerdere versie van dit bestand
# had die wel, en die overschreef de publicatiemap waardoor de site offline
# ging. Wat er niet in staat, kan ook niets breken.

[build]
  functions = "netlify/functions"

# De tijdslimiet van een functie staat standaard op 10 seconden. Een AI-aanroep
# zit daar vlak tegenaan. 26 seconden is het maximum, maar wordt alleen
# toegekend op een betaald plan; op het gratis plan heeft dit geen effect en
# doet het ook geen kwaad.
[functions."ask-claude"]
  timeout = 26

# Voorkomt dat de browser oude code blijft serveren na een oplevering.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ---- Vangnet voor hoofdletters in bestandsnamen ----
#
# Bij het uploaden vanaf een iPhone krijgen afbeeldingen soms een extensie in
# hoofdletters: icon-192.PNG in plaats van icon-192.png. Linux — en dus
# Netlify — ziet dat als een ander bestand, en dan geeft het icoon een 404.
# Dat is in dit project al drie keer gebeurd: eerst met Netlify/Functions,
# toen met Icons, nu met de iconen zelf.
#
# Deze regels vangen dat af. Ze zijn NIET geforceerd, en dat is precies de
# bedoeling: Netlify gebruikt een omleiding alleen wanneer het gevraagde
# bestand niet bestaat. Staan de bestanden ooit wél met kleine letters in de
# map, dan wint het echte bestand en doen deze regels niets. Zo werkt het in
# beide gevallen.
[[redirects]]
  from = "/icon-96.png"
  to = "/icon-96.PNG"
  status = 200

[[redirects]]
  from = "/icon-180.png"
  to = "/icon-180.PNG"
  status = 200

[[redirects]]
  from = "/icon-192.png"
  to = "/icon-192.PNG"
  status = 200

[[redirects]]
  from = "/icon-512.png"
  to = "/icon-512.PNG"
  status = 200
