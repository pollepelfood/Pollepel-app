<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3F66" />
      <stop offset="1" stop-color="#152C48" />
    </linearGradient>
    <linearGradient id="wood" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E3B278" />
      <stop offset="0.5" stop-color="#B87A3F" />
      <stop offset="1" stop-color="#8B5A2B" />
    </linearGradient>
    <linearGradient id="woodHandle" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#C98A47" />
      <stop offset="1" stop-color="#9C6530" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#F6DFB6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#F6DFB6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bg)" />

  <!-- Delft-tegel hoekmotief -->
  <rect x="52" y="52" width="34" height="34" rx="6" fill="rgba(255,255,255,0.09)" transform="rotate(45 69 69)" />
  <rect x="426" y="426" width="34" height="34" rx="6" fill="rgba(255,255,255,0.07)" transform="rotate(45 443 443)" />
  <rect x="426" y="52" width="18" height="18" rx="4" fill="rgba(255,255,255,0.06)" transform="rotate(45 435 61)" />

  <g transform="translate(256 256) scale(0.72) translate(-256 -256) rotate(-28 256 256)">
    <!-- schaduw onder de lepel -->
    <ellipse cx="182" cy="266" rx="98" ry="76" fill="#0E2038" opacity="0.25" />

    <!-- handvat: taps toelopend hout, van kop naar uiteinde -->
    <path d="M244 224
             C 300 214, 368 212, 420 224
             L 436 240
             C 441 247, 441 259, 436 266
             L 420 282
             C 368 290, 300 288, 244 278
             Z"
          fill="url(#woodHandle)" stroke="#6B4423" stroke-width="4" stroke-linejoin="round" />
    <!-- houtnerf op handvat -->
    <path d="M258 236 C 320 230, 380 229, 424 238" stroke="#6B4423" stroke-width="2.4" fill="none" opacity="0.35" />
    <path d="M258 266 C 320 272, 380 271, 422 264" stroke="#6B4423" stroke-width="2.4" fill="none" opacity="0.3" />
    <!-- gaatje om op te hangen -->
    <circle cx="408" cy="253" r="9" fill="#152C48" opacity="0.9" />
    <circle cx="408" cy="253" r="9" fill="none" stroke="#6B4423" stroke-width="2.5" />

    <!-- lepelkop: ovale houten bak -->
    <ellipse cx="176" cy="256" rx="96" ry="70" fill="url(#wood)" stroke="#6B4423" stroke-width="6" />
    <ellipse cx="176" cy="256" rx="80" ry="56" fill="none" stroke="#6B4423" stroke-width="2" opacity="0.3" />
    <!-- houtnerf in de kop -->
    <path d="M108 240 C 150 226, 210 226, 250 244" stroke="#6B4423" stroke-width="2.6" fill="none" opacity="0.3" />
    <path d="M104 268 C 150 284, 212 286, 252 266" stroke="#6B4423" stroke-width="2.6" fill="none" opacity="0.28" />
    <path d="M118 254 C 155 246, 200 246, 236 256" stroke="#6B4423" stroke-width="2" fill="none" opacity="0.22" />
    <!-- glans -->
    <ellipse cx="150" cy="228" rx="46" ry="24" fill="url(#sheen)" />
  </g>

  <!-- Damp boven de lepelkop. Staat bewust BUITEN de gedraaide groep: stoom
       stijgt recht omhoog, hoe de lepel ook ligt. -->
  <g stroke="#F6F4EE" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M168 232 c -13 -23, 11 -34, -2 -57 c -10 -18, 8 -28, 0 -43" opacity="0.26" />
    <path d="M212 220 c -12 -21, 10 -31, -2 -51 c -9 -16, 7 -25, 0 -37" opacity="0.17" />
  </g>
</svg>

